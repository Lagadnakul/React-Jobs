version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  api:
    image: node:18-alpine
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    command: npm run server